[package]
name = "ugit"
version = "2.0.0"
description = "uGit - an interactive git client"
authors = ["Stuart Millington"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ugit_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
ureq = { version = "2", features = ["json", "tls"] }
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "crypto-rust"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "rand_core", "getrandom"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
